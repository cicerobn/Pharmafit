<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Configurações — Gestão Pharma Fit</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d1b18">
<link rel="icon" href="../../assets/img/logo-pf-marca.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="app.css?v=c01fe180">
</head>
<body>

<div class="app">
  <main>

    <div class="pagina">
      <a class="pagina__volta" href="mais.html" data-volta aria-label="Voltar"></a>
      <h1 class="pagina__titulo">Configurações</h1>
    </div>

    <!-- o cartão do negócio, com o que está cadastrado de verdade -->
    <section class="bloco">
      <a class="empresa" href="../ajustes.html#bloco-banco">
        <span class="empresa__marca">
          <img src="../../assets/img/logo-pf-marca.png" alt="">
        </span>
        <span class="empresa__corpo">
          <span class="empresa__nome">Pharma Fit</span>
          <span class="empresa__linha" data-empresa-onde>Saúde, performance e bem-estar</span>
          <span class="empresa__dado" data-empresa-zap></span>
          <span class="empresa__dado" data-empresa-dono></span>
        </span>
        <span class="empresa__seta" data-empresa-seta></span>
      </a>
    </section>

    <!-- O WHATSAPP DO SITE, TROCÁVEL DAQUI.
         Brian, 24/09/2026: "editável o número para se esse for banido".
         Antes o número morava num arquivo do código, e trocar exigia
         publicar o site — justamente quando o número acabou de ser
         banido e as vendas estão caindo num número que ninguém lê.
         Salvo aqui, ele vai para o banco, e o site inteiro (a bolinha
         verde, o botão de fechar o pedido, o rodapé) passa a usar o
         novo na próxima vez que alguém abrir uma página. -->
    <p class="rotulo-secao">WhatsApp do site</p>
    <section class="bloco">
      <form class="bloco__corpo zap-form" data-zap-form novalidate>
        <label class="campo">
          <span class="campo__rotulo">Número com DDD</span>
          <input type="tel" inputmode="tel" autocomplete="off" data-zap-numero
                 placeholder="(92) 99999-9999">
        </label>
        <p class="campo__nota" data-zap-nota>
          É para este número que vão a bolinha verde do site, o botão de
          fechar o pedido e todos os outros links de WhatsApp. Se ele for
          banido, troque aqui e salve: o site muda sozinho, sem precisar
          publicar nada.
        </p>
        <p class="folha__recado" data-zap-recado role="status" hidden></p>
        <button class="botao botao--forte" type="submit" data-zap-salvar>Salvar número</button>
      </form>
    </section>

    <p class="rotulo-secao">Geral</p>
    <section class="bloco">
      <ul class="lista" data-geral></ul>
    </section>

    <!-- A SEÇÃO "SISTEMA" SAIU DAQUI, com os atalhos "Cópia de
         segurança" e "Tabelas do banco" (Brian, 19/09/2026: "Tire
         isso"). O rótulo saiu junto com a lista: cartão vazio com
         título em cima é pior que cartão nenhum — parece coisa que
         quebrou.
         As duas funções continuam em `ajustes.html`, na mesma página
         que as linhas de "Geral" abrem. -->

    <section class="bloco">
      <div class="bloco__corpo" style="padding-top:14px">
        <button class="gaveta__sair" type="button" data-sair-aqui>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-4"/><path d="M10 17l-5-5 5-5M5 12h10"/>
          </svg>
          <span>Sair da conta</span>
        </button>
      </div>
    </section>

  </main>
</div>

<script src="../assets/config.js?v=55118931"></script>
<script src="../assets/util.js?v=a2c25918"></script>
<script src="../../assets/js/catalogo.js?v=303ca501"></script>
<script src="../assets/auth.js?v=2fb8bdb5"></script>
<script src="../assets/dados.js?v=67d872c8"></script>
<script src="../assets/analise.js?v=e2445f21"></script>
<script src="app.js?v=ed2f7d61"></script>
<script src="configuracoes.js?v=790a1fc1"></script>
</body>
</html>
