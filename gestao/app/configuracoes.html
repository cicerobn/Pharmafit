<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Configurações — Gestão Pharma Fit</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d1b18">
<link rel="icon" href="../../assets/img/logo-pf-marca.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="app.css?v=35f2c6fa">
</head>
<body>

<div class="app">
  <main>

    <div class="pagina">
      <a class="pagina__volta" href="mais.html" data-volta aria-label="Voltar"></a>
      <h1 class="pagina__titulo">Configurações</h1>
    </div>

    <!-- o cartão do negócio, com o que está cadastrado de verdade -->
    <section class="bloco">
      <a class="empresa" href="../ajustes.html#bloco-banco">
        <span class="empresa__marca">
          <img src="../../assets/img/logo-pf-marca.png" alt="">
        </span>
        <span class="empresa__corpo">
          <span class="empresa__nome">Pharma Fit</span>
          <span class="empresa__linha" data-empresa-onde>Saúde, performance e bem-estar</span>
          <span class="empresa__dado" data-empresa-zap></span>
          <span class="empresa__dado" data-empresa-dono></span>
        </span>
        <span class="empresa__seta" data-empresa-seta></span>
      </a>
    </section>

    <p class="rotulo-secao">Geral</p>
    <section class="bloco">
      <ul class="lista" data-geral></ul>
    </section>

    <p class="rotulo-secao">Sistema</p>
    <section class="bloco">
      <ul class="lista" data-sistema></ul>
    </section>

    <!-- O que a foto do Brian tem e a Pharma Fit ainda não tem.
         Fica escrito na tela em vez de virar linha que não abre nada. -->
    <section class="bloco" data-bloco-falta hidden>
      <div class="bloco__topo">
        <h2 class="bloco__titulo">Ainda não existe</h2>
      </div>
      <div class="bloco__corpo">
        <p class="falta__lead">
          Estas telas aparecem no modelo que você me mandou e a Pharma Fit
          ainda não tem. Preferi dizer aqui do que pôr um botão que não abre
          nada:
        </p>
        <ul class="falta" data-falta></ul>
      </div>
    </section>

    <section class="bloco">
      <div class="bloco__corpo" style="padding-top:14px">
        <button class="gaveta__sair" type="button" data-sair-aqui>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-4"/><path d="M10 17l-5-5 5-5M5 12h10"/>
          </svg>
          <span>Sair da conta</span>
        </button>
      </div>
    </section>

  </main>
</div>

<script src="../assets/config.js?v=55118931"></script>
<script src="../assets/util.js?v=a2c25918"></script>
<script src="../../assets/js/catalogo.js?v=3f137909"></script>

<script src="../assets/analise.js?v=e2445f21"></script>
<script src="app.js?v=65c368c1"></script>
<script src="configuracoes.js?v=d1e21de1"></script>
</body>
</html>
