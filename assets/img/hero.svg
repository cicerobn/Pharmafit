<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 620" role="img" aria-label="Frasco de tirzepatida Pharma Fit com seringa">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0dcae"/>
      <stop offset=".35" stop-color="#c9a863"/>
      <stop offset=".7" stop-color="#a9843e"/>
      <stop offset="1" stop-color="#d8bd83"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3caa0"/>
      <stop offset=".5" stop-color="#b08c4a"/>
      <stop offset="1" stop-color="#e3caa0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e5de"/>
      <stop offset=".14" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f3f0ea"/>
      <stop offset=".85" stop-color="#ded8ce"/>
      <stop offset="1" stop-color="#efece6"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset="1" stop-color="#e4ddd1"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#e7e0d5"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#c9c3ba"/>
      <stop offset="1" stop-color="#9d968b"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d5f42"/>
      <stop offset="1" stop-color="#1f3524"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#6b5a3c" flood-opacity=".2"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-6" dy="10" stdDeviation="9" flood-color="#6b5a3c" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- arco dourado -->
  <circle cx="372" cy="262" r="242" fill="none" stroke="url(#goldLine)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="1260 260" transform="rotate(122 372 262)"/>

  <!-- folhagem -->
  <g opacity=".95">
    <path d="M592 82c42 26 54 90 26 136-40-22-54-90-26-136z" fill="url(#leaf)"/>
    <path d="M592 82c-6 48 6 104 26 136" fill="none" stroke="#6f8f72" stroke-width="2" opacity=".5"/>
    <path d="M646 182c14 48-12 100-58 114 0-48 22-96 58-114z" fill="url(#leaf)"/>
    <path d="M646 182c-26 32-46 70-58 114" fill="none" stroke="#6f8f72" stroke-width="2" opacity=".45"/>
    <path d="M548 160c36 12 58 56 52 100-38-14-60-58-52-100z" fill="url(#leaf)" opacity=".9"/>
  </g>

  <!-- bloco de mármore -->
  <g filter="url(#softer)">
    <rect x="476" y="296" width="184" height="176" rx="8" fill="url(#marble)"/>
    <path d="M502 328c26 16 42 44 34 76M562 310c14 30 10 62-8 88" fill="none" stroke="#cfc6b6" stroke-width="2" opacity=".5"/>
  </g>

  <!-- base / pódio -->
  <g filter="url(#soft)">
    <rect x="248" y="450" width="342" height="56" rx="10" fill="url(#slab)"/>
    <rect x="248" y="450" width="342" height="10" rx="5" fill="#ffffff" opacity=".7"/>
  </g>

  <!-- frasco -->
  <g transform="translate(322 106) scale(1.17)" filter="url(#soft)">
    <rect x="14" y="0" width="92" height="52" rx="7" fill="url(#gold)"/>
    <rect x="26" y="8" width="11" height="38" rx="5" fill="#fff" opacity=".35"/>
    <rect x="10" y="50" width="100" height="16" rx="4" fill="#d9d3c8"/>
    <rect x="4" y="64" width="112" height="238" rx="12" fill="url(#glass)" stroke="#dad4c9" stroke-width="1.2"/>
    <rect x="10" y="240" width="100" height="56" rx="10" fill="#cfc7b8" opacity=".38"/>
    <rect x="4" y="118" width="112" height="112" fill="#ffffff"/>
    <rect x="4" y="118" width="112" height="112" fill="none" stroke="#ece7de" stroke-width="1"/>
    <text x="60" y="152" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13.5"
          letter-spacing="1.3" fill="#131313">TIRZEPATIDA</text>
    <line x1="30" y1="164" x2="90" y2="164" stroke="#c9a863" stroke-width="1.2"/>
    <text x="60" y="182" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="7.6"
          letter-spacing="3" fill="#6e6a64">PHARMA FIT</text>
    <g transform="translate(46 192) scale(.28)">
      <rect x="6" y="6" width="20" height="88" fill="#101010"/>
      <rect x="26" y="6" width="50" height="17" fill="#101010"/>
      <rect x="59" y="6" width="17" height="40" fill="#101010"/>
      <rect x="26" y="38" width="58" height="16" fill="#b08c4a"/>
    </g>
    <rect x="16" y="78" width="9" height="200" rx="5" fill="#ffffff" opacity=".55"/>
  </g>

  <!-- seringa (à frente do frasco) -->
  <g transform="translate(62 158) rotate(38) scale(1.12)" filter="url(#softer)">
    <path d="M0 -1.4h78v2.8H0z" fill="url(#steel)"/>
    <path d="M78 -4.5h16v9H78z" fill="#c4beb3"/>
    <rect x="94" y="-15" width="168" height="30" rx="6" fill="url(#glass)" stroke="#cec8bd" stroke-width="1.2"/>
    <g stroke="#b0a99e" stroke-width="1.2">
      <line x1="118" y1="-15" x2="118" y2="-6"/>
      <line x1="138" y1="-15" x2="138" y2="-6"/>
      <line x1="158" y1="-15" x2="158" y2="-6"/>
      <line x1="178" y1="-15" x2="178" y2="-6"/>
      <line x1="198" y1="-15" x2="198" y2="-6"/>
      <line x1="218" y1="-15" x2="218" y2="-6"/>
    </g>
    <rect x="156" y="-14" width="22" height="28" rx="3" fill="#3f3f3f"/>
    <rect x="178" y="-4.5" width="86" height="9" rx="4.5" fill="#8f8a82"/>
    <rect x="262" y="-15" width="62" height="30" rx="7" fill="#fbfaf7" stroke="#ded8cd" stroke-width="1.2"/>
    <rect x="318" y="-18" width="28" height="36" rx="8" fill="url(#gold)"/>
  </g>
</svg>
