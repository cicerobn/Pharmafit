<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" role="img" aria-label="Seleção de produtos Pharma Fit">
  <defs>
    <linearGradient id="bb-box" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#282828"/>
      <stop offset=".55" stop-color="#141414"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="bb-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#333"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="bb-pen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfdad0"/>
      <stop offset=".26" stop-color="#ffffff"/>
      <stop offset=".75" stop-color="#efeae1"/>
      <stop offset="1" stop-color="#c8c1b4"/>
    </linearGradient>
    <linearGradient id="bb-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9b3a7"/>
      <stop offset=".2" stop-color="#f6f4ef"/>
      <stop offset=".65" stop-color="#ded8cd"/>
      <stop offset="1" stop-color="#a9a397"/>
    </linearGradient>
    <linearGradient id="bb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eed9ae"/>
      <stop offset=".5" stop-color="#b08c4a"/>
      <stop offset="1" stop-color="#87682f"/>
    </linearGradient>
    <radialGradient id="bb-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c9a863" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c9a863" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="230" cy="176" rx="220" ry="150" fill="url(#bb-glow)"/>
  <ellipse cx="230" cy="298" rx="188" ry="18" fill="#000" opacity=".5"/>

  <!-- frasco -->
  <g transform="translate(58 92)">
    <rect x="14" y="0" width="64" height="34" rx="6" fill="url(#bb-gold)"/>
    <rect x="10" y="32" width="72" height="12" rx="4" fill="#8f887c"/>
    <rect x="4" y="42" width="84" height="164" rx="11" fill="url(#bb-glass)"/>
    <rect x="4" y="90" width="84" height="62" fill="#f7f5f1"/>
    <line x1="20" y1="106" x2="72" y2="106" stroke="#b08c4a" stroke-width="1"/>
    <g transform="translate(33 112) scale(.24)">
      <rect x="6" y="6" width="20" height="88" fill="#101010"/>
      <rect x="26" y="6" width="50" height="17" fill="#101010"/>
      <rect x="59" y="6" width="17" height="40" fill="#101010"/>
      <rect x="26" y="38" width="58" height="16" fill="#b08c4a"/>
    </g>
    <text x="46" y="146" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="6"
          letter-spacing="2.4" fill="#6e6a64">PHARMA FIT</text>
    <rect x="13" y="54" width="7" height="140" rx="3.5" fill="#ffffff" opacity=".5"/>
  </g>

  <!-- caixa com ampolas -->
  <g transform="translate(178 96)">
    <path d="M0 14 104 0v182L0 196z" fill="url(#bb-box)"/>
    <path d="M104 0l30 10v176l-30 10z" fill="url(#bb-side)"/>
    <g transform="translate(14 58) rotate(-7.6)">
      <text x="0" y="0" font-family="Inter,Arial,sans-serif" font-size="10" letter-spacing="2.6" fill="#e8d1a4">PHARMA FIT</text>
      <line x1="0" y1="11" x2="62" y2="11" stroke="#b08c4a" stroke-width="1"/>
      <text x="0" y="30" font-family="Inter,Arial,sans-serif" font-size="9" letter-spacing="1.2" fill="#ffffff">4 AMPOLAS</text>
    </g>
    <g transform="translate(28 130) rotate(-7.6) scale(.26)">
      <rect x="6" y="6" width="20" height="88" fill="#ffffff"/>
      <rect x="26" y="6" width="50" height="17" fill="#ffffff"/>
      <rect x="59" y="6" width="17" height="40" fill="#ffffff"/>
      <rect x="26" y="38" width="58" height="16" fill="#c9a863"/>
    </g>
  </g>

  <!-- ampolas soltas -->
  <g transform="translate(300 178)">
    <g>
      <path d="M6 0h12v9l5 7v46a7 7 0 0 1-7 7H8a7 7 0 0 1-7-7V16l5-7z" fill="url(#bb-glass)"/>
      <rect x="1" y="30" width="22" height="22" fill="#12100e" opacity=".9"/>
      <rect x="7" y="0" width="10" height="7" rx="3" fill="url(#bb-gold)"/>
    </g>
    <g transform="translate(28 -10)">
      <path d="M6 0h12v9l5 7v46a7 7 0 0 1-7 7H8a7 7 0 0 1-7-7V16l5-7z" fill="url(#bb-glass)"/>
      <rect x="1" y="30" width="22" height="22" fill="#12100e" opacity=".9"/>
      <rect x="7" y="0" width="10" height="7" rx="3" fill="url(#bb-gold)"/>
    </g>
  </g>

  <!-- caneta -->
  <g transform="translate(368 86) rotate(6)">
    <rect x="0" y="0" width="38" height="204" rx="18" fill="url(#bb-pen)"/>
    <rect x="8" y="12" width="6" height="178" rx="3" fill="#ffffff" opacity=".75"/>
    <rect x="0" y="132" width="38" height="24" fill="#2a2a2a" opacity=".85"/>
    <rect x="0" y="180" width="38" height="24" rx="11" fill="url(#bb-gold)"/>
    <rect x="12" y="202" width="14" height="18" rx="6" fill="#cdc6ba"/>
    <text x="19" y="54" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="6.5"
          letter-spacing="2.4" fill="#6e6a64" transform="rotate(90 19 54)">PHARMA FIT</text>
  </g>
</svg>
