    <rect x="4" y="42" width="156" height="14" rx="5" fill="#1c1c1c"/>
    <rect x="0" y="54" width="164" height="196" rx="16" fill="url(#j-body)"/>

    <!-- rótulo -->
    <rect x="0" y="92" width="164" height="126" fill="#0f0f0f" opacity=".94"/>
    <line x1="18" y1="108" x2="146" y2="108" stroke="#b08c4a" stroke-width="1"/>
    <g transform="translate(82 100) scale(.3)">
      <rect x="-40" y="6" width="20" height="88" fill="#ffffff"/>
      <rect x="-20" y="6" width="50" height="17" fill="#ffffff"/>
      <rect x="13" y="6" width="17" height="40" fill="#ffffff"/>
      <rect x="-20" y="38" width="58" height="16" fill="#c9a863"/>
