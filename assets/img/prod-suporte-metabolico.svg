<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Pote de Suporte Metabólico Pharma Fit">
  <defs>
    <linearGradient id="j-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a3418"/>
      <stop offset=".18" stop-color="#8a6329"/>
      <stop offset=".5" stop-color="#5d4119"/>
      <stop offset=".85" stop-color="#2e2010"/>
      <stop offset="1" stop-color="#5a4020"/>
    </linearGradient>
    <linearGradient id="j-lid" x1="0" y1="0" x2="1" y2="0">
