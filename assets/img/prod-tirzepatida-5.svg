<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Caixa e caneta de Tirzepatida 5 mg">
  <defs>
    <linearGradient id="d-box" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#232323"/>
      <stop offset=".55" stop-color="#131313"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="d-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f2f2f"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="d-pen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset=".24" stop-color="#5c5c5c"/>
      <stop offset=".62" stop-color="#242424"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="d-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8d1a4"/>
      <stop offset=".5" stop-color="#b08c4a"/>
      <stop offset="1" stop-color="#8d6c33"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="304" rx="150" ry="16" fill="#2b2416" opacity=".14"/>

  <!-- caixa -->
  <g transform="translate(36 96)">
    <path d="M0 18 116 0v190L0 208z" fill="url(#d-box)"/>
    <path d="M116 0l38 14v176l-38 14z" fill="url(#d-side)"/>
    <g transform="translate(14 58) rotate(-8.8)">
      <text x="0" y="0" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1.6" fill="#e8d1a4">TIRZEPATIDA</text>
      <text x="0" y="22" font-family="Inter,Arial,sans-serif" font-size="17" letter-spacing=".6" fill="#ffffff">5 mg</text>
      <line x1="0" y1="34" x2="70" y2="34" stroke="#b08c4a" stroke-width="1"/>
    </g>
    <g transform="translate(38 140) rotate(-8.8) scale(.3)">
      <rect x="6" y="6" width="20" height="88" fill="#ffffff"/>
      <rect x="26" y="6" width="50" height="17" fill="#ffffff"/>
      <rect x="59" y="6" width="17" height="40" fill="#ffffff"/>
      <rect x="26" y="38" width="58" height="16" fill="#c9a863"/>
    </g>
    <text x="14" y="188" font-family="Inter,Arial,sans-serif" font-size="6.5" letter-spacing="2" fill="#9b937f" transform="rotate(-8.8 14 188)">PHARMA FIT</text>
  </g>

  <!-- caneta aplicadora -->
  <g transform="translate(268 62) rotate(9)">
    <rect x="0" y="0" width="42" height="232" rx="20" fill="url(#d-pen)"/>
    <rect x="9" y="12" width="6" height="200" rx="3" fill="#ffffff" opacity=".22"/>
    <rect x="0" y="150" width="42" height="26" fill="#f3efe7" opacity=".9"/>
    <rect x="7" y="156" width="28" height="14" rx="3" fill="#1a1a1a" opacity=".8"/>
    <rect x="0" y="206" width="42" height="26" rx="12" fill="url(#d-gold)"/>
    <rect x="14" y="230" width="14" height="20" rx="6" fill="#3a3a3a"/>
    <text x="21" y="60" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="7"
          letter-spacing="2.4" fill="#c9a863" transform="rotate(90 21 60)">PHARMA FIT</text>
  </g>
</svg>
