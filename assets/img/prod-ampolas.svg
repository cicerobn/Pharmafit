      <stop offset="0" stop-color="#242424"/>
      <stop offset=".55" stop-color="#131313"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="a-side" x1="0" y1="0" x2="1" y2="0">
