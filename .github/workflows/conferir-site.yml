# Confere o site no ar depois que a Hostinger publica.
#
# Este repositório não tem passo de montagem: a Hostinger publica a branch
# `main` direto, então não há nada para este arquivo construir. O que ele faz é
# a outra metade, a que costuma faltar: OLHAR o site depois.
#
# Ele existe porque a rede de onde o desenvolvimento acontece é bloqueada para
# o domínio da Hostinger. O runner do GitHub não é — então é daqui que se
# consegue ver se a publicação chegou, e o que ele imprime é o que se lê depois.
#
# Ele confere exatamente as coisas que já quebraram neste site:
#
#   - a página abre (e diz o código quando não abre)
#   - vem em UTF-8 — sem isso "saúde" viraria "saÃºde", e já virou
#   - o estilo e o script principais abrem, e com o tipo certo
#   - o schema do banco e o código da função de servidor NÃO são servidos
#   - o 404 é a página própria e não a do servidor

name: Conferir o site no ar

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Uma vez por dia: hospedagem que quebra sozinha existe, e é melhor saber
  # por um aviso do que por um cliente.
  schedule:
    - cron: '0 11 * * *'

jobs:
  conferir:
    runs-on: ubuntu-latest

    steps:
      - name: Pegar o código
        uses: actions/checkout@v5
        with:
          # Vinte commits, não dois. O script pergunta ao git o que este PUSH
          # mudou, para não pedir 115 arquivos quando 34 respondem. Com a
          # profundidade 1 do padrão, `HEAD~1` não existe, a conferência cai
          # no caminho de reserva e a economia não acontece — sem nenhum erro
          # para avisar. E dois não bastavam: quem manda três commits de uma
          # vez tem o ponto de partida do push FORA do clone.
          fetch-depth: 20

      - name: Preparar o Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # O banco do Supabase é compartilhado por oito negócios, e tem 81 tabelas
      # sem prefixo com nomes genéricos (`produtos`, `notas`, `leads`). Gravar
      # na tabela do vizinho não dá erro na tela — só mistura os dados, e depois
      # não separa. Isto para a publicação antes disso acontecer.
      - name: Conferir que a gestão só fala com as tabelas dela
        run: node conferir-tabelas.mjs gestao pf_

      # E O SITE TAMBÉM. Esta linha faltava, e o preço foi alto.
      #
      # Esta conferência olhava só `gestao/`. A pasta `assets/` do site
      # público nunca passou por ela — e era exatamente ali que estava o
      # defeito: quando as tabelas ganharam o prefixo `pf_` (migração 02),
      # o painel foi ajustado e o site não. Os quatro formulários (pedido,
      # fila de espera, orçamento de atacado e representante) ficaram
      # mandando para `pedidos`, `espera`, `orcamentos` e
      # `representantes` — medido no banco em 16/09/2026: NENHUMA das
      # quatro existe. Nada do que o cliente preenchia chegava ao painel,
      # e a tela não tinha como avisar.
      #
      # Conferir metade de um repositório é quase não conferir: o furo
      # mora justamente na metade que ninguém olha.
      - name: Conferir que o site só fala com as tabelas dele
        run: node conferir-tabelas.mjs assets pf_

      # A marca de versão nos endereços de script e estilo.
      #
      # Medido em 15/09/2026: a hospedagem responde com cópia ANTIGA de
      # `app.js` em metade dos pedidos, e o `.htaccess` ainda manda o navegador
      # guardar script por um dia. Junto, dá o defeito mais chato de todos: a
      # mudança funciona para quem publicou e o cliente continua vendo o site de
      # ontem, sem erro nenhum na tela.
      #
      # A marca resolve porque muda o ENDEREÇO. Mas marca velha faz o CONTRÁRIO
      # do que promete: garante que o cliente continue no arquivo antigo. Então
      # ela é conferida aqui, e a publicação para se alguma ficou atrás.
      #
      # CORREÇÃO, medida em 15/09/2026 mais tarde: eu escrevia aqui que "não
      # existe cópia velha de um endereço que ninguém pediu ainda". Existe. A
      # publicação não é atômica — o HTML pode chegar antes do CSS, e quem
      # pedir o endereço com a marca nova nessa janela recebe o arquivo VELHO,
      # que o CDN então guarda sob o endereço novo por 24 horas. Quem mais
      # pedia nessa janela era a própria conferência, mil vezes. Está
      # explicado no passo "Conferir o site", onde foi consertado.
      - name: Conferir as marcas de versão dos scripts
        run: node marcar-versao.mjs --conferir

      # CSS escrito errado não dá erro: o navegador engole o trecho que não
      # entende e segue em frente. Fechei um comentário e continuei escrevendo
      # depois da marca de fechar — o texto solto apagou a regra inteira do
      # `.linkish`, o site abriu normal, as seis suítes passaram, e os links
      # voltaram a parecer texto morto nas 16 páginas. Fiz isso duas vezes na
      # mesma tarde e só a foto da tela me pegou. Este passo pega antes.
      - name: Conferir que o CSS não tem erro de escrita
        run: node conferir-css.mjs

      # Página nova nasce do esqueleto de uma pronta, e o cabeçalho invisível
      # vem junto. Quatro páginas nasceram de `privacidade.html` e diziam ao
      # WhatsApp que eram "Seus dados"; a 404 nasceu de `atendimento.html` e se
      # anunciava como atendimento. Não aparece na tela — aparece no
      # quadradinho que o cliente vê quando manda o link, e a página mais
      # compartilhada é a do produto.
      - name: Conferir que cada página se anuncia como ela mesma
        run: node conferir-paginas.mjs

      # O site fala português e espanhol, e a tradução é um dicionário de
      # frases exatas. O risco é escrever frase nova numa página e esquecer o
      # dicionário: aí o site em espanhol fica com um pedaço em português, e
      # meio traduzido é pior que não traduzido — o cliente paraguaio acha que
      # quebrou. Este passo exige que toda frase de tela tenha tradução, ou
      # esteja na lista do que não se traduz (nome de produto, dose, marca).
      - name: Conferir que não há texto sem tradução
        run: node conferir-idioma.mjs

      # Tabela nova no painel precisa entrar em duas listas escritas à mão:
      # a do teste de conexão e a da CÓPIA DE SEGURANÇA. Esquecer a segunda
      # faz o backup sair incompleto sem avisar — e isso só aparece no dia
      # de precisar dele. Este passo lê as coleções que o painel realmente
      # usa e exige que todas estejam nas duas listas.
      - name: Conferir que nenhuma tabela ficou fora do backup
        run: node conferir-listas.mjs

      # O preço de compra de cada produto é número de dono. Medido em
      # 17/09/2026: ele estava escrito no código do site (doze linhas em
      # assets/js/catalogo.js) E vinha do banco na leitura da vitrine, porque
      # a regra de leitura liberava a linha inteira. Com a chave do visitante
      # — a que está dentro do código, pública por natureza — dava para ler
      # a margem dos 11 produtos.
      #
      # Este passo fecha os dois caminhos pela forma: nenhum `custo: <número>`
      # em arquivo que o site serve, e nenhuma leitura das tabelas que trazem
      # custo (para isso existem as vistas sem a coluna). Gravar pedido
      # continua liberado, que é a compra acontecendo.
      - name: Conferir que o preço de compra não está no código do site
        run: node conferir-custo-no-site.mjs

      # A barra lateral e a barra de baixo estão escritas à mão nas 16 páginas.
      # Dezesseis cópias mantidas por memória, e elas desencontraram: medido em
      # 17/09/2026, em 13 das 16 a barra lateral não tinha Atendimento nem
      # Conta, e a página de erro tinha um item só. O visitante que abrisse o
      # menu no carrinho via um site menor do que o site é — e nada na tela
      # dava erro para alguém notar.
      #
      # Este passo não pede menu bonito nem completo: pede menu IGUAL em todas.
      - name: Conferir que o menu é o mesmo em toda página
        run: node conferir-menus.mjs

      # ---------- a loja nova, que mora em /loja/ ----------
      #
      # Este repositório publica a branch como ela está, e a loja é React: ela
      # precisa ser MONTADA. A pasta `loja/` no repositório é essa montagem, já
      # feita, e a fonte está em `loja-fonte/`.
      #
      # O risco óbvio disso é as duas divergirem — alguém mexe na fonte, esquece
      # de montar, e o que está no ar continua o antigo sem ninguém notar. Então
      # a publicação monta do zero e COMPARA. Se diferir, ela falha.
      - name: Instalar as dependências da loja
        working-directory: loja-fonte
        run: npm ci

      - name: Conferir que nenhum segredo entrou no código da loja
        working-directory: loja-fonte
        run: node conferir-segredos.mjs

      - name: Conferir que a loja só fala com as tabelas dela
        run: node conferir-tabelas.mjs loja-fonte/src loja2_

      - name: Conferir as contas de calendário da loja
        working-directory: loja-fonte
        run: node periodos.teste.mjs

      - name: Conferir que a pasta /loja/ é a montagem da fonte
        run: |
          # GITHUB_SHA vazio de propósito: sem commit, a marca de versão é a
          # impressão digital dos arquivos montados, que é determinística. Com o
          # commit, ela mudaria a cada publicação e o versao.txt teria de ficar
          # fora da comparação — assim ele entra nela também, e nada escapa.
          cd loja-fonte
          GITHUB_SHA= npm run build --silent
          cd ..

          diferentes=""
          for arq in $(cd loja-fonte/dist && find . -type f | sed 's|^\./||'); do
            if [ ! -f "loja/$arq" ]; then
              diferentes="$diferentes $arq(falta)"
            elif ! cmp -s "loja-fonte/dist/$arq" "loja/$arq"; then
              diferentes="$diferentes $arq"
            fi
          done

          # e o contrário: sobrou arquivo velho em loja/ que a montagem não gera?
          for arq in $(cd loja && find . -type f | sed 's|^\./||'); do
            [ -f "loja-fonte/dist/$arq" ] || diferentes="$diferentes $arq(sobrando)"
          done

          if [ -n "$diferentes" ]; then
            echo "::error::A pasta loja/ não é a montagem de loja-fonte/. Diferentes:${diferentes}"
            echo "Conserto: cd loja-fonte && npm run build && cp -r dist/. ../loja/"
            exit 1
          fi
          echo "A pasta loja/ é exatamente a montagem da fonte."

      - name: Conferir o site
        env:
          # Sobrescreva com a variável SITE_URL quando o domínio mudar; sem ela,
          # a lista de candidatos abaixo é tentada uma por uma.
          SITE_URL: ${{ vars.SITE_URL }}
        run: bash .github/conferir-no-ar.sh
