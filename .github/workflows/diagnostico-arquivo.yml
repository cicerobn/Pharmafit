# Diagnóstico de um arquivo que não chega igual ao do repositório.
#
# Por que existe: a rede de onde o desenvolvimento acontece é bloqueada para o
# domínio da Hostinger. Este arquivo é o único lugar de onde se consegue OLHAR.
#
# Adivinhar a causa é o erro que já custou uma manhã neste projeto. Isto não
# conserta nada: pede os arquivos, imprime cabeçalhos, tamanho, md5 e o que
# mais der, para a causa aparecer em vez de ser chutada.
#
# Roda só quando alguém pede (workflow_dispatch). É diagnóstico, não guarda.

name: Diagnóstico de arquivo

on:
  workflow_dispatch:

jobs:
  olhar:
    runs-on: ubuntu-latest
    steps:
      - name: Pegar o código
        uses: actions/checkout@v5

      - name: Olhar o que o servidor devolve
        run: |
          alvo="https://darkblue-deer-373108.hostingersite.com"

          # A PERGUNTA DE AGORA (17/09/2026)
          #
          # A conferencia completa reprovou dizendo que 7 imagens nao chegaram:
          # os seis PNG do logo e um arquivo chamado "ChatGPT Image 17 de set.
          # de 2026, 10_08_52.png", solto na raiz.
          #
          # A causa MUDA O QUE E URGENTE, e as duas possiveis pedem consertos
          # opostos:
          #
          #   a) o arquivo nao esta no servidor (HTTP 404) -> o logo esta
          #      QUEBRADO para todo visitante, e o conserto e na publicacao;
          #
          #   b) o arquivo esta la, valido, mas com bytes diferentes dos do
          #      repositorio -> a hospedagem recomprimiu a imagem, o site esta
          #      CERTO, e quem esta errado e a conferencia, que compara md5 de
          #      imagem e vai reprovar todo dia, para sempre, sem motivo.
          #
          # O que separa (a) de (b): o codigo HTTP, o tipo do que veio (PNG
          # comeca com \x89PNG) e o tamanho. PNG valido e menor que o do
          # repositorio e (b).
          #
          # Nao adianta perguntar pelo endereco com marca de versao: imagem
          # aqui nao leva marca. Pergunto no endereco cru, que e o que o
          # visitante pede, e furando o cache, que e a unica forma de saber o
          # que esta NO SERVIDOR.
          #
          # E pergunto com o nome como esta e com os espacos em %20: nome com
          # espaco e virgula e uma das suspeitas, e a propria conferencia
          # avisa para olhar isso antes de culpar a hospedagem.
          for arq in \
            assets/img/logo-pf-marca.png \
            assets/img/logo-pf-icone.png \
            assets/img/logo-pf-192.png \
            assets/img/logo-pf-512.png \
            assets/img/logo-pf-compartilhar.png \
            assets/img/logo-pf-original.png \
            "ChatGPT Image 17 de set. de 2026, 10_08_52.png" \
          ; do
            echo "================================================================"
            echo "  $arq"
            echo "================================================================"
            if [ -f "$arq" ]; then
              aqui=$(md5sum "$arq" | cut -d' ' -f1)
              echo "  no repositorio: $(wc -c < "$arq") bytes · md5 ${aqui:0:12} · $(file -b "$arq" | cut -c1-60)"
            else
              aqui="(nao existe aqui)"
              echo "  no repositorio: NAO EXISTE — se a conferencia cobra este"
              echo "                  arquivo, o problema esta na lista dela"
            fi
            echo

            escapado=$(printf '%s' "$arq" | sed 's/ /%20/g')

            for forma in "cru:$alvo/$arq" "escapado:$alvo/$escapado" "furando o cache:$alvo/$escapado?nocache=$RANDOM$RANDOM"; do
              rotulo="${forma%%:*}"; url="${forma#*:}"
              cod=$(curl -s -o /tmp/veio -w '%{http_code}' --max-time 25 "$url" 2>/dev/null || echo 000)
              tam=$(wc -c < /tmp/veio 2>/dev/null || echo 0)
              tipo=$(file -b /tmp/veio 2>/dev/null | cut -c1-38)
              la=$(md5sum /tmp/veio 2>/dev/null | cut -d' ' -f1)
              igual="DIFERENTE"
              [ "$la" = "$aqui" ] && igual="IGUAL ao repositorio"
              [ "$cod" != "200" ] && igual="—"
              printf '  %-16s HTTP %s %8d bytes  %s  %-20s %s\n' \
                     "$rotulo" "$cod" "$tam" "${la:0:12}" "$igual" "$tipo"
            done

            echo
            echo "  cabecalhos (sinal de cache ou de otimizacao):"
            curl -sI --max-time 25 "$alvo/$escapado" | tr -d '\r' \
              | grep -iE 'HTTP/|content-type|content-length|etag|last-modified|age|cache|expires|x-litespeed|x-cache|vary|server' \
              | sed 's/^/      /'
            echo
          done

          echo "================================================================"
          echo "  COMO LER O RESULTADO"
          echo "================================================================"
          echo "  · 404 em todas as formas -> o arquivo NAO esta publicado"
          echo "  · 200 com PNG valido e tamanho menor -> a hospedagem"
          echo "    recomprimiu: o site esta certo e a conferencia e que tem"
          echo "    de parar de comparar md5 de imagem"
          echo "  · 200 no escapado e 404 no cru -> e o nome do arquivo"
          echo
          echo "Fim do diagnostico. Nada foi alterado."
