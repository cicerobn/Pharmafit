# Diagnóstico de um arquivo que não chega igual ao do repositório.
#
# Por que existe: a rede de onde o desenvolvimento acontece é bloqueada para o
# domínio da Hostinger. Este arquivo é o único lugar de onde se consegue OLHAR.
#
# Adivinhar a causa é o erro que já custou uma manhã neste projeto. Isto não
# conserta nada: pede os arquivos várias vezes e imprime cabeçalhos, tamanho,
# md5 e a diferença, para a causa aparecer em vez de ser chutada.
#
# Roda só quando alguém pede (workflow_dispatch). É diagnóstico, não guarda.

name: Diagnóstico de arquivo

on:
  workflow_dispatch:

jobs:
  olhar:
    runs-on: ubuntu-latest
    steps:
      - name: Pegar o código
        uses: actions/checkout@v5

      - name: Olhar o que o servidor devolve
        run: |
          alvo="https://darkblue-deer-373108.hostingersite.com"

          # A PERGUNTA DE AGORA
          #
          # A conferencia reprovou tres publicacoes seguidas dizendo que
          # `gestao/assets/gestao.css` e `gestao/assets/painel.js` nao chegaram.
          # Mas o relatorio dela se contradiz: `dados.js` aparece como AUSENTE
          # na tentativa 1, PRESENTE na 3, ausente de novo na 4 e presente na 5.
          #
          # Arquivo publicado nao despublica. Uma lista que oscila desse jeito
          # nao esta medindo se o arquivo chegou — esta medindo outra coisa.
          #
          # A SUSPEITA: a conferencia pede ~101 arquivos, ate duas vezes cada,
          # dez vezes seguidas. Sao uns 2000 pedidos ao mesmo servidor em cinco
          # minutos. Se ele comeca a recusar ou a demorar, o `curl -fsS` falha,
          # a saida vem VAZIA, e o md5 do vazio nunca bate com o md5 do arquivo.
          # Pedido recusado e conteudo errado viram a mesma coisa no relatorio.
          #
          # Isto NAO conserta nada. Pede o mesmo arquivo 40 vezes em sequencia e
          # imprime o codigo HTTP de cada pedido, para a causa aparecer:
          #
          #   · se todos derem 200 com o md5 certo → a suspeita esta errada e o
          #     problema e outro (edge do CDN com copias diferentes, por ex.)
          #   · se os primeiros derem 200 e os seguintes 429/503/000 → e limite
          #     de pedidos, e o conserto e na conferencia, nao no site
          alvo2="$alvo"
          for arq in gestao/assets/gestao.css gestao/assets/painel.js; do
            marca=$(grep -ho "$(basename "$arq")?v=[a-f0-9]*" gestao/*.html *.html 2>/dev/null | head -1 | sed 's/.*?v=//')
            aqui=$(md5sum "$arq" | cut -d' ' -f1)
            echo "================================================================"
            echo "  40 pedidos seguidos de $arq?v=$marca"
            echo "  md5 no repositorio: ${aqui:0:12}"
            echo "================================================================"
            certos=0; errados=0; recusados=0
            linha=""
            for n in $(seq 1 40); do
              cod=$(curl -s -o /tmp/veio2 -w '%{http_code}' --max-time 20 \
                    "$alvo2/$arq?v=$marca" 2>/dev/null || echo 000)
              la=$(md5sum /tmp/veio2 | cut -d' ' -f1)
              if [ "$cod" = "200" ] && [ "$la" = "$aqui" ]; then
                linha="$linha."; certos=$((certos+1))
              elif [ "$cod" = "200" ]; then
                linha="$linha?"; errados=$((errados+1))
                echo "    pedido $n: HTTP 200 mas md5 ${la:0:12} (conteudo diferente)"
              else
                linha="$linha X"; recusados=$((recusados+1))
                echo "    pedido $n: HTTP $cod (o servidor nao entregou)"
              fi
            done
            echo "    $linha"
            echo "    certos=$certos  conteudo-diferente=$errados  nao-entregues=$recusados"
            echo "    ( . = certo   ? = 200 com outro conteudo   X = nao entregue )"
            echo
          done

          echo "================================================================"
          echo "  E agora o exame de sempre, arquivo por arquivo"
          echo "================================================================"
          for arq in gestao/assets/gestao.css assets/css/styles.css; do
            marca=$(grep -ho "$(basename "$arq")?v=[a-f0-9]*" gestao/*.html *.html 2>/dev/null | head -1 | sed 's/.*?v=//')
            aqui=$(md5sum "$arq" | cut -d' ' -f1)

            echo "================================================================"
            echo "  $arq"
            echo "================================================================"
            echo "  no repositorio: $(wc -c < "$arq") bytes · md5 $aqui"
            echo "  marca nas paginas: ${marca:-<nenhuma>}"
            echo

            # O CORPO VAI PARA ARQUIVO, e nao para uma variavel.
            #
            # A primeira versao disto fazia `corpo=$(curl ...)`, e o $( ) do
            # shell COME o \n do fim. Resultado: todo arquivo de texto aparecia
            # com um byte a menos e md5 diferente, inclusive o styles.css, que a
            # conferencia de verdade aprova dez vezes por dia. Meu proprio
            # diagnostico estava mentindo, do mesmo jeito que as coisas que eu
            # passei o dia consertando. Arquivo nao tem essa mania.
            for forma in "sem marca:$alvo/$arq" "com marca:$alvo/$arq?v=$marca" "furando o cache:$alvo/$arq?nocache=$RANDOM$RANDOM"; do
              rotulo="${forma%%:*}"; url="${forma#*:}"
              if curl -fsS --max-time 20 "$url" -o /tmp/veio 2>/dev/null; then
                la=$(md5sum /tmp/veio | cut -d' ' -f1)
                tam=$(wc -c < /tmp/veio)
                igual="DIFERENTE"
                [ "$la" = "$aqui" ] && igual="IGUAL ao repositorio"
                printf '  %-16s %6d bytes  %s  %s\n' "$rotulo" "$tam" "${la:0:12}" "$igual"
                if [ "$igual" = "DIFERENTE" ]; then
                  echo "      primeira diferenca: $(cmp "$arq" /tmp/veio 2>&1 | head -1)"
                fi
              else
                printf '  %-16s  nao respondeu\n' "$rotulo"
              fi
            done

            echo
            echo "  cabecalhos do endereco sem marca (procurando sinal de cache):"
            curl -sI --max-time 20 "$alvo/$arq" | tr -d '\r' \
              | grep -iE 'HTTP/|content-length|etag|last-modified|age|cache|expires|x-litespeed|x-cache|vary|server' \
              | sed 's/^/      /'
            echo
            echo "  cabecalhos do endereco COM marca:"
            curl -sI --max-time 20 "$alvo/$arq?v=$marca" | tr -d '\r' \
              | grep -iE 'HTTP/|content-length|etag|last-modified|age|cache|expires|x-litespeed|x-cache|vary|server' \
              | sed 's/^/      /'
            echo
          done

          echo "Fim do diagnostico. Nada foi alterado."
